# 誤差模型：各輸入誤差的 1σ，用來計算 TargetWorld 的 uncertainty_m
#
# 2026-11-01 用 A 的 5 段 Gazebo 紀錄（hover 20/30/50 m、follow 20 m、yawcheck 20 m，約 2.9 萬筆姿態）標定：
#   python -m analysis.calibrate_error_model <5 個 session> --estimate-position-lag
# 這批資料沒有 detections.jsonl（pose-only），所以 pixel_sigma_px 仍是假設值。
# 選值原則：用「追蹤飛行時」的情況（跟車段），而不是最安靜的懸停段，避免 uncertainty_m 低估。

pixel_sigma_px: 2.0         # ASSUMED：待 B 對 A 的 frames/ 跑完偵測後標定

roll_pitch_sigma_deg: 0.2   # 實測：懸停 0.01°；跟車轉彎 roll 0.13°、pitch 0.25°（取跟車段）

yaw_sigma_deg: 4.1          # 實測 RMS（偏差 +3.7° 加抖動 1.6°）。PX4 EKF 航向從開機就偏約 +4.4°，
                            # 起飛、懸停、原地轉一圈都不會修正，要水平直線飛約 15 s 才收斂到 0。
                            # 偏差是系統性的，只填標準差（1.6°）會低估；源頭修好（或起飛後先直線飛對準）再改回約 1.0

altitude_sigma_m: 0.06      # 實測：0.056 m

horizontal_position_sigma_m: 0.2  # 實測：懸停約 0.015 m；移動中約 0.19 m（各軸）。
                                  # 移動時位置比 Gazebo 真值領先約 90 ms（姿態則同步），速度 2.5 m/s 時約 0.23 m，待 A 確認原因
