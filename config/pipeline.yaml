# 即時流程設定（coord_transform/pipeline.py 的 TargetWorldPipeline.from_config 讀取）

# bbox 參考點：center_half_height（規格 §2.4 v0.2.2）/ bottom_center / center
# center_half_height：bbox 中心與物體半高平面求交，再投影回地面。nadir 看車時誤差從底邊中點的
# 最多 3.4 m 降到 0.1 m 以下（analysis/README.md 實驗 5）。只用於相機模型流程；影片 homography 用底邊中點。
reference_point: center_half_height

# 影像時間戳要加多少 ms 才等於姿態時鐘的同一時刻。
# 0：規格 v0.1.2 §2.3 確認「差 24 ms」是舊 20 Hz 姿態的取樣錯開，不是固定偏移；
# 依影像時間戳在姿態序列上內插即可。之後可用 python -m analysis.replay <session> --estimate-time-offset 複查。
frame_time_offset_ms: 0.0

# 偵測幀等姿態的佇列上限（30 Hz 下 10 幀約 330 ms）；超過就以 no_pose 輸出最舊的
max_pending_frames: 10

# 姿態改用 odometry 後約 100 Hz（間隔 8–12 ms）；規格 §2.3 規定相鄰兩筆超過 150 ms 就不插值
pose_max_gap_ms: 150

# 姿態緩衝保留多久（規格 §2.3：至少 2 秒）
pose_horizon_ms: 2000
